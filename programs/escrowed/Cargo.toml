[package]
name = "escrowed"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "escrowed"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31"
# `default-features = false` keeps the HTTP client out of the on-chain build.
escrowed-core = { path = "../..", default-features = false }

[workspace]

# This crate detaches into its own workspace, so the release profile must be set
# here for the SBF build. overflow-checks makes an arithmetic overflow abort the
# instruction rather than wrap — required by Anchor and correct for escrow math.
[profile.release]
overflow-checks = true
